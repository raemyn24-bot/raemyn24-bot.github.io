<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rae 的像素小屋</title>
<style>
  html,body { margin:0; padding:0; height:100%; background:#070b16; overflow:hidden; -webkit-user-select:none; user-select:none; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #room { width:min(100vw,205.04vh); height:min(100vh,48.77vw); display:block; touch-action:manipulation; }
  #room text { font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  /* 唱片旋转 */
  #vinyl { transform-box:fill-box; transform-origin:center; }
  #vinyl.spin { animation:spin 1.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* 提示箭头浮动 */
  .hint { animation:hintBob 1.8s ease-in-out infinite; }
  @keyframes hintBob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
  .hint.dim { opacity:.15; animation:none; }
  /* 人物阴影 */
  .shadow { fill:rgba(0,0,0,.28); }
  /* 对话条 */
  #dialog { position:fixed; left:50%; transform:translateX(-50%); bottom:max(10px, env(safe-area-inset-bottom)); width:min(94vw,900px); z-index:50;
    background:#f7efdc; border:3px solid #7a5c3e; border-radius:12px; padding:10px 16px; font-size:16px; color:#4a3826;
    box-shadow:0 4px 18px rgba(0,0,0,.45); cursor:pointer; }
  #dialog .who { font-weight:700; color:#8a5a2b; margin-right:8px; }
  /* 面板 */
  #panel { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(5,8,18,.72); }
  #panel.open { display:flex; }
  #panelCard { width:min(92vw,560px); max-height:86vh; overflow:auto; background:#f7efdc; border:3px solid #7a5c3e; border-radius:14px; padding:18px 20px; color:#4a3826; }
  #panelCard h2 { margin:0 0 10px; font-size:20px; color:#8a5a2b; }
  #panelClose { float:right; border:2px solid #7a5c3e; background:#fff; border-radius:8px; padding:4px 12px; cursor:pointer; font-size:15px; }
  /* 音乐图标 */
  #musicNote { animation:floatUp 2.6s ease-in-out infinite; }
  @keyframes floatUp { 0%,100% { transform:translateY(0); opacity:.9; } 50% { transform:translateY(-14px); opacity:.5; } }
</style>
</head>
<body>
<div id="stage">
<svg id="room" viewBox="0 0 1993 972" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="winClip"><rect x="750" y="15" width="655" height="380" rx="4"/></clipPath>
  </defs>

  <!-- ===== 底板（夜/日） ===== -->
  <image id="plateNight" href="assets/plate-night.webp" x="0" y="0" width="1993" height="972"/>
  <image id="plateDay" href="assets/plate-day.webp" x="0" y="0" width="1993" height="972" opacity="0"/>

  <!-- ===== 天气（窗户里） ===== -->
  <g id="wx" clip-path="url(#winClip)">
    <rect id="wxSky" x="750" y="15" width="655" height="380" fill="#101a3d"/>
    <g id="wxSunMoon"></g>
    <g id="wxClouds"></g>
    <g id="wxCity"></g>
    <g id="wxPrecip"></g>
    <polygon id="wxBolt" points="" fill="#fffbe0" opacity="0"/>
    <rect id="wxFlash" x="750" y="15" width="655" height="380" fill="#ffffff" opacity="0"/>
  </g>

  <!-- ===== 钢琴键（12键） ===== -->
  <g id="keys"></g>

  <!-- ===== 唱片 ===== -->
  <image id="vinyl" href="assets/disc.png" x="1191" y="429" width="116" height="77"/>

  <!-- ===== 日历 ===== -->
  <g id="cal">
    <rect x="1445" y="120" width="120" height="180" rx="8" fill="#f7f1e3" stroke="#7a5c3e" stroke-width="5"/>
    <rect x="1445" y="120" width="120" height="42" fill="#c0392b"/>
    <circle cx="1475" cy="112" r="7" fill="#5a4a3a"/><circle cx="1535" cy="112" r="7" fill="#5a4a3a"/>
    <text id="calM" x="1505" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">10月</text>
    <text id="calD" x="1505" y="225" text-anchor="middle" font-size="64" font-weight="800" fill="#333">21</text>
    <text id="calW" x="1505" y="268" text-anchor="middle" font-size="24" fill="#666">星期三</text>
  </g>

  <!-- ===== 猫 ===== -->
  <ellipse class="shadow" cx="1148" cy="800" rx="110" ry="18"/>
  <image id="cat" href="assets/cat-body.png" x="1032" y="700" width="233" height="106"/>

  <!-- ===== 人物 ===== -->
  <ellipse id="girlShadow" class="shadow" cx="0" cy="0" rx="34" ry="10"/>
  <image id="girl" href="assets/girl-idle.png" x="0" y="0" width="84" height="148"/>
  <ellipse id="boyShadow" class="shadow" cx="0" cy="0" rx="38" ry="11"/>
  <image id="boy" href="assets/boy-idle.png" x="0" y="0" width="94" height="164"/>

  <!-- ===== 音乐图标 ===== -->
  <text id="musicNote" x="0" y="0" font-size="44" text-anchor="middle" opacity="0">🎵</text>

  <!-- ===== 提示箭头 ===== -->
  <g id="hints"></g>

  <!-- ===== 点击区 ===== -->
  <g id="zones" fill="#fff" opacity="0">
    <rect data-id="piano" x="58" y="258" width="374" height="442"/>
    <rect data-id="shelf" x="246" y="106" width="412" height="454"/>
    <rect data-id="window" x="735" y="5" width="685" height="400"/>
    <rect data-id="record" x="1000" y="420" width="353" height="232"/>
    <rect data-id="desk" x="1295" y="258" width="477" height="469"/>
    <rect data-id="board" x="1613" y="164" width="301" height="356"/>
  </g>
</svg>
</div>

<div id="dialog"><span class="who">Rae</span><span id="dialogText">点一点房间里的东西，小人会自己走过去。</span></div>
<div id="panel"><div id="panelCard"><button id="panelClose">关闭</button><h2 id="panelTitle"></h2><div id="panelBody"></div></div></div>
<audio id="bgm" src="assets/gymnopedie.mp3" loop preload="auto"></audio>

<script>
"use strict";
const SVGNS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const svg = $('room');
let wxAnim = null; // 天气动画句柄（提前声明，避免TDZ）
let weather = { temp:19, desc:'小雨', kind:'rain', hi:20, lo:14, hum:91, ok:false };
function el(tag, attrs, parent){ const e = document.createElementNS(SVGNS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }

/* ---------- 基础 ---------- */
const isDayNow = ()=>{ const h = new Date().getHours(); return h>=6 && h<18; };
function say(who, text){ $('dialog').querySelector('.who').textContent = who; $('dialogText').textContent = text; }
function openPanel(title, html){ $('panelTitle').textContent = title; $('panelBody').innerHTML = html; $('panel').classList.add('open'); stopWxPanel(); }
$('panelClose').onclick = ()=>{ $('panel').classList.remove('open'); stopWxPanel(); };
$('panel').addEventListener('click', e=>{ if(e.target.id==='panel') { $('panel').classList.remove('open'); stopWxPanel(); } });

/* ---------- 日历真实日期 ---------- */
(function(){
  const d = new Date();
  $('calM').textContent = (d.getMonth()+1)+'月';
  $('calD').textContent = d.getDate();
  $('calW').textContent = '星期'+'日一二三四五六'[d.getDay()];
})();

/* ---------- 昼夜切换 ---------- */
function applyDayNight(){
  const day = isDayNow();
  $('plateDay').setAttribute('opacity', day ? 1 : 0);
  $('plateNight').setAttribute('opacity', day ? 0 : 1);
  buildKeys(day ? KEYS_DAY : KEYS_NIGHT);
  placeVinyl(day ? VINYL_DAY : VINYL_NIGHT);
  if(typeof drawWeather === 'function') drawWeather();
}
// 初始化在脚本末尾调用
// 底板渐变
$('plateDay').style.transition = 'opacity 1.4s ease';
$('plateNight').style.transition = 'opacity 1.4s ease';

/* ---------- BGM ---------- */
const bgm = $('bgm');
let playing = false, pianoTimer = null;
function toggleMusic(){
  playing = !playing;
  if(playing){ bgm.play().catch(()=>{}); $('vinyl').classList.add('spin'); setMusicNote(boy.x, boy.y-190, true); startPianoAuto(); say('Rae','♪ 钢琴自己弹起来了'); }
  else { bgm.pause(); $('vinyl').classList.remove('spin'); setMusicNote(0,0,false); stopPianoAuto(); say('Rae','音乐停了。'); }
}
function startPianoAuto(){
  stopPianoAuto();
  const chords = [[0,4,7],[2,5,9],[4,7,11],[5,9,0]];
  let ci = 0;
  pianoTimer = setInterval(()=>{
    const ch = chords[ci++ % chords.length];
    ch.forEach(k=>pressKey(k,true));
    setTimeout(()=>ch.forEach(k=>pressKey(k,false)), 700);
  }, 1100);
}
function stopPianoAuto(){ if(pianoTimer){ clearInterval(pianoTimer); pianoTimer=null; } KEYS.els.forEach((_,i)=>pressKey(i,false)); }

/* ---------- 面板内容 ---------- */
const PANELS = {
  piano: ['🎹 钢琴', '<p>点一下钢琴，开始 / 停止播放萨蒂《Gymnopédie No.1》。</p><p>播放时琴键会自动按下，唱片也会转起来。</p><button onclick="toggleMusic()" style="padding:8px 20px;font-size:16px;">播放 / 停止</button>'],
  shelf: ['📚 书架', '<p>这里放着 Rae 的书。</p><p><i>（等 Rae 发来书单，这里会换成真正的内容）</i></p>'],
  window: ['🌦 窗外 · 杭州', ''],
  desk: ['💻 书桌', '<p>Rae 的工作台。</p><p><i>（等 Rae 发来介绍和联系方式）</i></p>'],
  board: ['📌 留言板', '<div id="gbList"></div><input id="gbName" placeholder="名字" style="width:30%"><input id="gbText" placeholder="留句话吧" style="width:60%"><button onclick="addNote()">贴上</button>'],
  record: ['🎵 唱片机', '<p>黑胶唱机。点钢琴开始播放，唱片就会转。</p>'],
};
function updateWeatherPanel(){
  const d = new Date(), wk = '日一二三四五六'[d.getDay()];
  return `<p style="font-size:34px;margin:6px 0;">${weather.temp}°C <span style="font-size:18px;">杭州 · ${weather.desc}</span></p>
    <p>今日 ${weather.lo}° ~ ${weather.hi}°C · 湿度 ${weather.hum}% · ${d.getMonth()+1}月${d.getDate()}日 星期${wk}${weather.ok?'':'（天气接口没连上，兜底数据）'}</p>
    <p>窗外现在就是这个天气 ☁️</p>`;
}
// 留言板
let notes = JSON.parse(localStorage.getItem('rae_notes')||'[{"n":"屋主 Rae","t":"欢迎来到我的小房间，留张便签再走吧 📌"}]');
function renderNotes(){ const l=$('gbList'); if(!l) return; l.innerHTML = notes.map(n=>`<p><b>${n.n}:</b> ${n.t}</p>`).join(''); }
function addNote(){ const n=$('gbName').value.trim()||'匿名', t=$('gbText').value.trim(); if(!t) return; notes.push({n,t}); localStorage.setItem('rae_notes',JSON.stringify(notes)); renderNotes(); $('gbText').value=''; }

/* ---------- 点击触发 ---------- */
const STAND = { piano:[300,640], shelf:[480,620], window:[965,560], record:[1176,640], desk:[1500,700], board:[1764,620] };
document.querySelectorAll('#zones rect').forEach(z=>{
  z.style.cursor='pointer'; z.style.pointerEvents='all';
  z.addEventListener('click', ()=>{
    const id = z.dataset.id;
    const [tx,ty] = STAND[id];
    walkTo(tx, ty, ()=>{
      if(id==='piano') toggleMusic();
      else {
        let [t,h] = PANELS[id];
        if(id==='window') h = updateWeatherPanel();
        openPanel(t,h);
        if(id==='board') renderNotes();
        say('Rae', {shelf:'书架上都是宝贝。', window:'窗外是杭州今天的样子。', desk:'我的书桌，有点乱。', board:'看看大家都留了什么。', record:'黑胶的味道。'}[id]||'');
      }
    });
  });
});
// 点空白处关闭面板
$('dialog').onclick = ()=>{ $('panel').classList.remove('open'); };
function stopWxPanel(){}

const boy = { el:$('boy'), sh:$('boyShadow'), x:877, y:758, w:94, h:164 };
const girl = { el:$('girl'), sh:$('girlShadow'), x:797, y:758, w:84, h:148 };
function place(p){ p.el.setAttribute('x', p.x-p.w/2); p.el.setAttribute('y', p.y-p.h); p.sh.setAttribute('cx', p.x); p.sh.setAttribute('cy', p.y+6); }
place(boy); place(girl);
// 女孩跟着男孩
let girlTarget = null;

/* 简易寻路：直线 + 绕开猫 */
const CAT = { x0:1032, x1:1265, y0:720, y1:806 };
function planPath(x0,y0,x1,y1){
  const pts = [[x0,y0]];
  // 如果直线穿过猫，加绕行点
  const inCat = (x,y)=> x>CAT.x0-30 && x<CAT.x1+30 && y>CAT.y0-20 && y<CAT.y1+20;
  if(inCat((x0+x1)/2,(y0+y1)/2) || inCat(x1,y1)){
    pts.push([(CAT.x0+CAT.x1)/2, CAT.y1+60]);
  }
  pts.push([x1,y1]);
  return pts;
}
let walking = false;
function walkTo(tx, ty, done){
  if(walking) return; walking = true;
  dimHints(true);
  const path = planPath(boy.x, boy.y, tx, ty);
  let si = 0;
  const speed = 260; // px/s
  let last = performance.now();
  // 女孩跟随目标
  girlTarget = { x: tx-80, y: ty };
  function step(t){
    const dt = Math.min(50, t-last)/1000; last = t;
    const [px,py] = path[si];
    const dx = px-boy.x, dy = py-boy.y, dist = Math.hypot(dx,dy);
    if(dist < 8){
      si++;
      if(si >= path.length){
        walking = false; dimHints(false);
        // 女孩走过去
        walkGirl();
        if(done) done();
        return;
      }
    } else {
      boy.x += dx/dist*speed*dt; boy.y += dy/dist*speed*dt;
      // 朝向（翻转）
      boy.el.style.transform = dx<0 ? 'scaleX(-1)' : '';
      boy.el.style.transformBox = 'fill-box'; boy.el.style.transformOrigin = 'center';
      place(boy);
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function walkGirl(){
  if(!girlTarget) return;
  const tx = girlTarget.x, ty = girlTarget.y;
  const dx = tx-girl.x, dy = ty-girl.y, dist = Math.hypot(dx,dy);
  if(dist < 10) return;
  const speed = 240;
  let last = performance.now();
  function step(t){
    const dt = Math.min(50, t-last)/1000; last = t;
    const dx2 = tx-girl.x, dy2 = ty-girl.y, d2 = Math.hypot(dx2,dy2);
    if(d2 < 10){ place(girl); return; }
    girl.x += dx2/d2*speed*dt; girl.y += dy2/d2*speed*dt;
    girl.el.style.transform = dx2<0 ? 'scaleX(-1)' : '';
    girl.el.style.transformBox = 'fill-box'; girl.el.style.transformOrigin = 'center';
    place(girl);
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

const KEYS_NIGHT = { x0:171, y0:453, x1:396, y1:519 };
const KEYS_DAY = { x0:175, y0:470, x1:375, y1:500 };
const KEYS = { n:12, els:[], cur:null };
function buildKeys(pos){
  const g = $('keys'); g.innerHTML=''; KEYS.els=[];
  const kw = (pos.x1-pos.x0)/KEYS.n;
  for(let i=0;i<KEYS.n;i++){
    const r = el('rect',{ x:pos.x0+i*kw+1, y:pos.y0, width:kw-2, height:pos.y1-pos.y0, fill:'#f2ede2', stroke:'#3a3128','stroke-width':1.5 },g);
    KEYS.els.push(r);
  }
  KEYS.cur = pos;
}
function pressKey(i, down){
  const r = KEYS.els[i]; if(!r || !KEYS.cur) return;
  r.setAttribute('fill', down ? '#c9a86a' : '#f2ede2');
  r.setAttribute('y', down ? KEYS.cur.y0+4 : KEYS.cur.y0);
}
/* ---------- 唱片（日夜双坐标） ---------- */
const VINYL_NIGHT = { x:1191, y:429, w:116, h:77 };
const VINYL_DAY = { x:1165, y:430, w:110, h:60 };
function placeVinyl(pos){ const v=$('vinyl'); v.setAttribute('x',pos.x); v.setAttribute('y',pos.y); v.setAttribute('width',pos.w); v.setAttribute('height',pos.h); }

/* ---------- 提示箭头（像素风） ---------- */
const HINTS = [ ['piano',249,384], ['shelf',458,292], ['window',1096,160], ['record',1176,437], ['desk',1574,408], ['board',1764,292] ];
(function(){
  const g = $('hints');
  HINTS.forEach(([id,x,y])=>{
    const im = el('image',{ href:'assets/hint-arrow.png', x:x-36, y:y-20, width:72, height:39, class:'hint', 'data-id':id },g);
    im.style.imageRendering = 'pixelated';
  });
})();
function dimHints(dim){ document.querySelectorAll('#hints .hint').forEach(h=>h.classList.toggle('dim',dim)); }

/* ---------- 音乐图标 ---------- */
function setMusicNote(x,y,show){ const n=$('musicNote'); n.setAttribute('x',x); n.setAttribute('y',y); n.setAttribute('opacity',show?1:0); }

const WMO = {0:'晴',1:'晴间多云',2:'多云',3:'阴',45:'雾',48:'雾',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'阵雨',81:'阵雨',82:'暴雨阵雨',85:'阵雪',86:'阵雪',95:'雷阵雨',96:'雷阵雨',99:'雷阵雨'};
function wmoKind(c){ if([95,96,99].includes(c)) return 'storm'; if([51,53,55,61,63,65,80,81,82].includes(c)) return 'rain'; if([71,73,75,77,85,86].includes(c)) return 'snow'; if(c===0) return 'clear'; if([1,2].includes(c)) return 'cloud'; return 'overcast'; }
fetch('https://api.open-meteo.com/v1/forecast?latitude=30.2741&longitude=120.1551&current=temperature_2m,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FShanghai')
  .then(r=>r.json()).then(d=>{ const c = d.current.weather_code;
    weather = { temp:Math.round(d.current.temperature_2m), desc:WMO[c]||'多云', kind:wmoKind(c),
      hi:Math.round(d.daily.temperature_2m_max[0]), lo:Math.round(d.daily.temperature_2m_min[0]),
      hum:Math.round(d.current.relative_humidity_2m), ok:true };
    drawWeather();
  }).catch(()=>{});

/* ---------- SVG 天气（窗户里，750,15,655x380） ---------- */
const WX = { x:750, y:15, w:655, h:380 };
function drawWeather(){
  if(wxAnim) cancelAnimationFrame(wxAnim);
  const day = isDayNow(), kind = weather.kind;
  const gSun = $('wxSunMoon'), gCl = $('wxClouds'), gCity = $('wxCity'), gPr = $('wxPrecip');
  [gSun,gCl,gCity,gPr].forEach(g=>g.innerHTML='');
  $('wxBolt').setAttribute('points',''); $('wxBolt').setAttribute('opacity',0);
  // 天空
  const sky = $('wxSky');
  if(kind==='overcast'||kind==='rain'||kind==='storm') sky.setAttribute('fill', day?'#7a8ba3':'#1a2340');
  else sky.setAttribute('fill', day?'#5f9de0':'#101a3d');
  // 太阳/月亮/星星
  if(kind==='clear'||kind==='cloud'){
    if(day){ el('circle',{cx:1240,cy:80,r:34,fill:'#ffd94d'},gSun); el('circle',{cx:1240,cy:80,r:46,fill:'#ffd94d','fill-opacity':.3},gSun); }
    else {
      for(let i=0;i<50;i++) el('rect',{x:WX.x+Math.random()*WX.w, y:WX.y+Math.random()*180, width:2.5, height:2.5, fill:'#ffeec2'},gSun);
      el('circle',{cx:1240,cy:80,r:26,fill:'#f5d76e'},gSun); el('circle',{cx:1230,cy:72,r:22,fill: day?'#5f9de0':'#101a3d'},gSun);
    }
  }
  // 云
  const nCl = kind==='clear'?3 : kind==='cloud'?5 : 7;
  const clouds = [];
  for(let i=0;i<nCl;i++){
    const c = el('g',{},gCl);
    const cx = WX.x + i*(WX.w/nCl) + Math.random()*40, cy = WX.y+40+Math.random()*60, w = 90+Math.random()*70;
    el('ellipse',{cx, cy, rx:w/2, ry:16, fill: day?(kind==='clear'?'#ffffff':'#eef2f8'):'#4a5a85','fill-opacity':.92},c);
    el('ellipse',{cx:cx+24, cy:cy-10, rx:w/3, ry:13, fill: day?(kind==='clear'?'#ffffff':'#eef2f8'):'#4a5a85','fill-opacity':.92},c);
    clouds.push({e:c, x:cx, ox:cx, v:.2+Math.random()*.3});
  }
  // 城市剪影
  const cityB = [[760,245,70,150],[845,275,55,120],[915,230,80,165],[1010,265,60,130],[1080,240,75,155],[1170,280,55,115],[1235,250,78,145],[1325,275,60,120]];
  cityB.forEach(b=> el('rect',{x:b[0],y:b[1],width:b[2],height:b[3],fill: day?'#5d7ba6':'#0c1330'},gCity));
  if(!day) for(let i=0;i<70;i++) el('rect',{x:766+((i*53)%620), y:260+((i*29)%110), width:4, height:4, fill:'#ffca7a'},gCity);
  el('rect',{x:WX.x, y:WX.y+WX.h-24, width:WX.w, height:24, fill: day?'#7d94b5':'#090f24'},gCity);
  // 降水粒子
  const parts = [];
  if(kind==='rain'||kind==='storm') for(let i=0;i<110;i++) parts.push({t:'r', x:WX.x+Math.random()*WX.w, y:WX.y+Math.random()*WX.h, v:7+Math.random()*5});
  if(kind==='snow') for(let i=0;i<70;i++) parts.push({t:'s', x:WX.x+Math.random()*WX.w, y:WX.y+Math.random()*WX.h, v:.8+Math.random(), ph:Math.random()*6.28});
  let flashT = 0, flash = 0;
  function frame(t){
    clouds.forEach(c=>{ c.x += c.v; if(c.x - 80 > WX.x+WX.w) c.x = WX.x - 80; c.e.setAttribute('transform', `translate(${c.x-c.ox},0)`); });
    gPr.innerHTML='';
    parts.forEach(p=>{
      if(p.t==='r'){ p.y+=p.v*2.4; p.x-=p.v*.7; if(p.y>WX.y+WX.h){p.y=WX.y;p.x=WX.x+Math.random()*WX.w;}
        el('line',{x1:p.x,y1:p.y,x2:p.x-4,y2:p.y+16,stroke:'rgba(190,215,250,.7)','stroke-width':2},gPr); }
      else { p.y+=p.v; p.x+=Math.sin(t/600+p.ph)*.6; if(p.y>WX.y+WX.h){p.y=WX.y;p.x=WX.x+Math.random()*WX.w;}
        el('circle',{cx:p.x,cy:p.y,r:2.6,fill:'rgba(255,255,255,.92)'},gPr); }
    });
    if(kind==='storm'){
      flashT--;
      if(flashT<=0){ flash=14; flashT=140+Math.random()*300; }
      if(flash>0){ flash--;
        $('wxFlash').setAttribute('opacity', .5*(flash/14));
        if(flash>8){ const lx=900+Math.random()*300;
          $('wxBolt').setAttribute('points', `${lx},15 ${lx-32},105 ${lx+8},105 ${lx-42},215 ${lx-6},215 ${lx-48},345`);
          $('wxBolt').setAttribute('opacity',.95);
        } else $('wxBolt').setAttribute('opacity',0);
      } else { $('wxFlash').setAttribute('opacity',0); $('wxBolt').setAttribute('opacity',0); }
    }
    wxAnim = requestAnimationFrame(frame);
  }
  wxAnim = requestAnimationFrame(frame);
}

/* ---------- 初始化 ---------- */
place(boy); place(girl);
applyDayNight(); setInterval(applyDayNight, 60000);
