<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rae's Room</title>
<style>
  html,body{margin:0;padding:0;background:#0a0a12;overflow:hidden;height:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  svg{width:100vw;height:100vh}
  .finger{animation:fingerBob 1.6s ease-in-out infinite;cursor:pointer}
  @keyframes fingerBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .finger.dim{opacity:.25}
  .star{animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
  #catTail{transform-box:fill-box;transform-origin:85% 55%;animation:tailWag 7s ease-in-out infinite}
  @keyframes tailWag{0%,65%,100%{transform:rotate(0deg)}75%{transform:rotate(-14deg)}85%{transform:rotate(9deg)}92%{transform:rotate(-4deg)}}
  .steam{animation:steamRise 3s ease-in-out infinite;opacity:0}
  @keyframes steamRise{0%{transform:translateY(0);opacity:0}30%{opacity:.7}100%{transform:translateY(-35px);opacity:0}}
  .note{animation:noteFloat 2.5s ease-out forwards;opacity:0}
  @keyframes noteFloat{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 2.5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #dlg{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);max-width:92vw;background:#f5ecd7;border:3px solid #8a6f4d;border-radius:12px;padding:10px 18px;font-size:15px;color:#4a3a28;display:none;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.4)}
  #panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#f5ecd7;border:3px solid #8a6f4d;border-radius:14px;padding:20px 24px;max-width:88vw;max-height:70vh;overflow:auto;display:none;z-index:20;box-shadow:0 8px 32px rgba(0,0,0,.5)}
  #panel h3{margin:0 0 10px;font-size:18px;color:#4a3a28}
  #panel .close{position:absolute;top:8px;right:12px;cursor:pointer;font-size:20px;color:#8a6f4d}
  #infobar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,20,35,.85);color:#c9c9d4;font-size:12px;text-align:center;padding:8px;z-index:5}
</style>
</head>
<body>
<div id="wrap">
<svg viewBox="0 0 1993 972" preserveAspectRatio="xMidYMid meet">
  <image href="assets/plate-night.webp" x="0" y="0" width="1993" height="972"/>
  <g id="stars"></g>
  <g id="steamG"></g>
  <g id="recordSpin"></g>
  <g id="notesG"></g>
  <g id="fingers"></g>
  <g id="tapZones" fill="#fff" opacity="0"></g>
</svg>
</div>
<div id="dlg"></div>
<div id="panel"><span class="close" onclick="hidePanel()">✕</span><h3 id="panelTitle"></h3><div id="panelBody"></div></div>
<div id="infobar">🎹钢琴听音乐 · 🎵唱片机 · 📚书桌 · 📌留言板 · 🌙窗户看天气 —— 点手指互动</div>
<audio id="bgm" loop src="assets/gymnopedie.mp3"></audio>
<script>
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
function el(n,attrs,parent){const e=document.createElementNS(NS,n);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}

// Stars
(function(){const g=$('stars');
  [[964,61],[939,206],[1000,150],[1150,120],[1194,81],[894,172],[1220,202],[1088,80]].forEach(([x,y],i)=>{
    el('circle',{cx:x,cy:y,r:2.5,fill:'#fff8dc',class:'star',style:'animation-delay:'+(i*0.4)+'s'},g);
  });
})();

// Coffee steam - cup on cabinet at approx (1080,585)
(function(){const g=$('steamG');
  for(let i=0;i<3;i++){
    const p=el('path',{d:'M0,0 q5,-10 0,-20 q-5,-10 0,-20',stroke:'#e8e8e8','stroke-width':2.5,fill:'none','stroke-linecap':'round',class:'steam',style:'animation-delay:'+(i*1.0)+'s'},g);
    p.setAttribute('transform','translate('+(1072+i*10)+',570)');
  }
})();

// Record player spin indicator - small rotating highlight on the vinyl
// Vinyl center approx (1260,530) in old coords, in new plate ~ (1150, 520)
(function(){
  const g=$('recordSpin');
  // A subtle rotating arc on the turntable
  const c=el('circle',{cx:1250,cy:525,r:32,fill:'none',stroke:'#aaa','stroke-width':4,'stroke-dasharray':'25 175',class:'spin',id:'vinylSpin',style:'display:none'},g);
})();

// Fingers
const FINGERS=[['piano',240,380],['record',1295,445],['desk',1630,420],['board',1810,250],['window',1110,75]];
(function(){
  const g=$('fingers');
  FINGERS.forEach(([id,x,y])=>{
    const im=el('image',{x:x-22,y:y-48,width:44,height:48,href:'assets/finger.png',class:'finger'},g);
    im.dataset.id=id;
    im.addEventListener('click',ev=>{ev.stopPropagation();onTap(id);});
  });
  const tz=$('tapZones');
  const zones={piano:[150,300,180,160],record:[1200,380,190,150],desk:[1540,350,180,150],board:[1730,180,160,140],window:[980,20,260,120]};
  for(const id in zones){const [x,y,w,h]=zones[id];
    const r=el('rect',{x:x,y:y,width:w,height:h},tz);
    r.addEventListener('click',ev=>{ev.stopPropagation();onTap(id);});
  }
})();

let dlgTimer=null;
function say(t,ms=2500){const d=$('dlg');d.textContent=t;d.style.display='block';clearTimeout(dlgTimer);dlgTimer=setTimeout(()=>d.style.display='none',ms);}
function dimFingers(on){document.querySelectorAll('.finger').forEach(f=>f.classList.toggle('dim',on));}
function showPanel(title,html){$('panelTitle').textContent=title;$('panelBody').innerHTML=html;$('panel').style.display='block';dimFingers(true);}
function hidePanel(){$('panel').style.display='none';dimFingers(false);}

let playing=false;const bgm=$('bgm');let noteTimer=null;
function toggleMusic(){
  playing=!playing;
  if(playing){bgm.play().catch(()=>{});$('vinylSpin').style.display='block';say('🎹 Gymnopédie No.1');startNotes();}
  else{bgm.pause();$('vinylSpin').style.display='none';say('音乐停了');stopNotes();}
}
function startNotes(){stopNotes();
  noteTimer=setInterval(()=>{if(!playing)return;
    const t=el('text',{x:230+Math.random()*80,y:330,fill:'#ffe9a8','font-size':30,class:'note'},$('notesG'));
    t.textContent=['♪','♫','♩'][Math.floor(Math.random()*3)];
    setTimeout(()=>t.remove(),2600);
  },700);
}
function stopNotes(){clearInterval(noteTimer);noteTimer=null;}

function onTap(id){
  hidePanel();
  if(id==='piano')toggleMusic();
  else if(id==='record')showPanel('🎵 唱片机','<p>Satie - Gymnopédie No.1</p><p style="color:#888;font-size:13px">点钢琴开始/停止播放，唱片会转哦</p>');
  else if(id==='desk')showPanel('📚 书桌','<p style="color:#888">Rae 的联系方式（待补充）</p>');
  else if(id==='board')showPanel('📌 留言板','<div id="gb"></div><div style="margin-top:8px"><input id="gbIn" placeholder="留句话..." style="width:65%;padding:6px"><button onclick="addMsg()" style="padding:6px 12px">贴</button></div>');
  else if(id==='window'){
    showPanel('🌙 杭州天气','<p>正在获取...</p>');
    fetch('https://api.open-meteo.com/v1/forecast?latitude=30.27&longitude=120.15&current=temperature_2m,weather_code&timezone=Asia%2FShanghai')
      .then(r=>r.json()).then(j=>{
        const w={0:'晴',1:'多云',2:'多云',3:'阴',45:'雾',51:'毛毛雨',61:'小雨',71:'小雪',95:'雷阵雨'}[j.current.weather_code]||'未知';
        $('panelBody').innerHTML='<p>杭州 '+j.current.temperature_2m+'°C，'+w+'</p>';
      }).catch(()=>{$('panelBody').innerHTML='<p>获取失败</p>';});
  }
}
window.addMsg=function(){const v=$('gbIn').value;if(!v)return;const d=document.createElement('div');d.textContent='📝 '+v;$('gb').appendChild(d);$('gbIn').value='';};

say('点一点房间里的东西试试',3500);
</script>
</body>
</html>
