<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rae 的像素小屋</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#070b16;overflow:hidden;-webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0 0 48px 0;display:flex;align-items:center;justify-content:center}
  #room{width:min(100vw,205.04vh);height:min(100vh,48.77vw);display:block;touch-action:manipulation}
  .tri{animation:triBob 1.6s ease-in-out infinite;cursor:pointer}
  .star{animation:twinkle 2.4s ease-in-out infinite}
  #catTail{transform-box:fill-box;transform-origin:15% 50%;animation:tailWagOcc 8s ease-in-out infinite}
  @keyframes tailWagOcc{0%,25%{transform:rotate(-8deg)}12%{transform:rotate(10deg)}25%,100%{transform:rotate(0deg)}}
  #catTail{transform-box:fill-box;transform-origin:15% 50%;animation:tailWagOcc 8s ease-in-out infinite}
  @keyframes tailWagOcc{0%,25%{transform:rotate(-8deg)}12%{transform:rotate(10deg)}25%,100%{transform:rotate(0deg)}}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes triBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  #dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:58px;width:min(94vw,900px);z-index:50;background:#f7efdc;border:3px solid #7a5c3e;border-radius:12px;padding:10px 16px;font-size:16px;color:#4a3826;box-shadow:0 4px 18px rgba(0,0,0,.45);cursor:pointer}
  #dialog .who{font-weight:700;color:#8a5a2b;margin-right:8px}
  #panel{position:fixed;inset:0 0 48px 0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,8,18,.72)}
  #panel.open{display:flex}
  #panelCard{width:min(92vw,560px);max-height:80vh;overflow:auto;background:#f7efdc;border:3px solid #7a5c3e;border-radius:14px;padding:18px 20px;color:#4a3826}
  #panelCard h2{margin:0 0 10px;font-size:20px;color:#8a5a2b}
  #panelClose{float:right;border:2px solid #7a5c3e;background:#fff;border-radius:8px;padding:4px 12px;cursor:pointer;font-size:15px}
  #infobar{position:fixed;left:0;right:0;bottom:0;height:48px;z-index:50;background:#1a1a2e;color:#ccc;display:flex;align-items:center;justify-content:center;font-size:13px;padding:0 12px;text-align:center}
              </style>
</head>
<body>
<div id="stage">
<svg id="room" viewBox="0 0 1993 972" preserveAspectRatio="xMidYMid meet">
  <image href="assets/plate-night.webp" x="0" y="0" width="1993" height="972"/>
  <g id="stars">
        <circle class="star" cx="964" cy="61" r="3" fill="#fff8dc" style="animation-delay:0.66s"/>
        <circle class="star" cx="939" cy="206" r="2.5" fill="#fff8dc" style="animation-delay:0.08s"/>
        <circle class="star" cx="1000" cy="150" r="2" fill="#fff8dc" style="animation-delay:1.72s"/>
        <circle class="star" cx="1150" cy="120" r="3" fill="#fff8dc" style="animation-delay:1.01s"/>
        <circle class="star" cx="1194" cy="81" r="2" fill="#fff8dc" style="animation-delay:0.91s"/>
        <circle class="star" cx="894" cy="172" r="3" fill="#fff8dc" style="animation-delay:0.3s"/>
        <circle class="star" cx="1220" cy="202" r="2" fill="#fff8dc" style="animation-delay:1.69s"/>
        <circle class="star" cx="1088" cy="80" r="2.5" fill="#fff8dc" style="animation-delay:0.67s"/>
  </g>
  
  
  
  
  <g id="cat">
    <ellipse cx="1050" cy="688" rx="90" ry="14" fill="rgba(0,0,0,.25)"/>
    <ellipse cx="1050" cy="660" rx="75" ry="32" fill="#4a4a55"/>
    <circle cx="985" cy="648" r="26" fill="#4a4a55"/>
    <polygon points="968,630 974,610 986,626" fill="#4a4a55"/>
    <polygon points="992,626 1004,610 1008,630" fill="#4a4a55"/>
    <circle cx="978" cy="646" r="3" fill="#1a1a20"/>
    <circle cx="994" cy="646" r="3" fill="#1a1a20"/>
    <g id="catTail">
      <path d="M1115,665 q35,-8 45,-28 q6,-12 -4,-16" stroke="#4a4a55" stroke-width="14" fill="none" stroke-linecap="round"/>
    </g>
  </g>
  <g id="tris"></g>
  <g id="zones" fill="#fff" opacity="0">
    <rect data-id="piano" x="80" y="400" width="320" height="320"/>
    <rect data-id="record" x="1140" y="455" width="240" height="170"/>
    <rect data-id="desk" x="1440" y="440" width="380" height="300"/>
    
    <rect data-id="board" x="1690" y="270" width="240" height="220"/>
    <rect data-id="window" x="820" y="40" width="580" height="360"/>
  </g>
</svg>
</div>
<div id="dialog"><span class="who">Rae</span><span id="dialogText">点一点房间里的东西试试。</span></div>
<div id="panel"><div id="panelCard"><button id="panelClose">关闭</button><h2 id="panelTitle"></h2><div id="panelBody"></div></div></div>
<div id="infobar">🎹钢琴听音乐 · 🎵唱片机 · 💻书桌 · 📅日历 · 📌留言板 · 🌙窗户看天气 —— 点三角互动</div>
<audio id="bgm" src="assets/gymnopedie.mp3" loop preload="auto"></audio>
<script>
"use strict";
const $=id=>document.getElementById(id);
const SVGNS="http://www.w3.org/2000/svg";
function el(t,a,p){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function say(w,t){document.querySelector('#dialog .who').textContent=w;document.querySelector('#dialogText').textContent=t}
function openPanel(t,h){$('panelTitle').textContent=t;$('panelBody').innerHTML=h;$('panel').classList.add('open')}
$('panelClose').onclick=()=>$('panel').classList.remove('open');
$('panel').addEventListener('click',e=>{if(e.target.id==='panel')$('panel').classList.remove('open')});

const TRIS=[['piano',240,380],['record',1295,445],['desk',1630,420],['board',1810,250],['window',1110,75]];
(function(){const g=$('tris');TRIS.forEach(([id,x,y])=>{const im=el('image',{x:x-22,y:y-48,width:44,height:48,href:'assets/finger.png',class:'tri'},g);im.dataset.id=id})})();
const bgm=$('bgm');let playing=false;
function toggleMusic(){playing=!playing;if(playing){bgm.play().catch(()=>{});say('Rae','♪ 萨蒂《Gymnopédie No.1》')}else{bgm.pause();say('Rae','音乐停了。')}}
let weather={temp:19,desc:'多云',hi:22,lo:15,hum:80,ok:false};
const WMO={0:'晴',1:'晴间多云',2:'多云',3:'阴',45:'雾',48:'雾',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'阵雨',81:'阵雨',82:'暴雨',95:'雷阵雨',96:'雷阵雨',99:'雷阵雨'};
fetch('https://api.open-meteo.com/v1/forecast?latitude=30.2741&longitude=120.1551&current=temperature_2m,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FShanghai').then(r=>r.json()).then(d=>{const c=d.current.weather_code;weather={temp:Math.round(d.current.temperature_2m),desc:WMO[c]||'多云',hi:Math.round(d.daily.temperature_2m_max[0]),lo:Math.round(d.daily.temperature_2m_min[0]),hum:Math.round(d.current.relative_humidity_2m),ok:true}}).catch(()=>{});
const PANELS={piano:['🎹 钢琴','<p>萨蒂《Gymnopédie No.1》</p><button onclick="toggleMusic()" style="padding:8px 20px;font-size:16px;">播放 / 停止</button>'],record:['🎵 唱片机','<p>正在播放：萨蒂《Gymnopédie No.1》</p><p>33⅓ RPM · 黑胶</p>'],desk:['💻 书桌','<p>Rae 的联系方式</p><p><i>（等 Rae 提供）</i></p>'],board:['📌 留言板','<div id="gbList"></div><input id="gbName" placeholder="名字" style="width:30%"><input id="gbText" placeholder="留句话吧" style="width:60%"><button onclick="addNote()">贴上</button>'],window:['🌙 窗外 · 杭州','']};
function updateCalPanel(){const d=new Date(),w='日一二三四五六'[d.getDay()];return `<p style="font-size:36px;">${d.getMonth()+1}月${d.getDate()}日</p><p>星期${w}</p>`}
function updateWeatherPanel(){const d=new Date(),w='日一二三四五六'[d.getDay()];return `<p style="font-size:32px;">${weather.temp}°C ${weather.desc}</p><p>杭州 · ${weather.lo}°~${weather.hi}° · 湿度${weather.hum}%</p><p>${d.getMonth()+1}月${d.getDate()}日 星期${w}${weather.ok?'':'（离线）'}</p>`}
let notes=JSON.parse(localStorage.getItem('rae_notes')||'[{"n":"屋主 Rae","t":"欢迎来到我的小房间！"}]');
function renderNotes(){const l=$('gbList');if(l)l.innerHTML=notes.map(n=>`<p><b>${n.n}:</b> ${n.t}</p>`).join('')}
function addNote(){const n=$('gbName').value.trim()||'匿名',t=$('gbText').value.trim();if(!t)return;notes.push({n,t});localStorage.setItem('rae_notes',JSON.stringify(notes));renderNotes();$('gbText').value=''}
function trigger(id){
  if(id==='piano'){toggleMusic();return}
  let[t,h]=PANELS[id];
  if(id==='cal')h=updateCalPanel();
  if(id==='window')h=updateWeatherPanel();
  openPanel(t,h);
  if(id==='board')renderNotes();
  say('Rae',{record:'黑胶的味道。',desk:'我的书桌。',board:'看看留言。',window:'窗外是杭州。',}[id]||'');
}
document.querySelectorAll('#zones rect').forEach(z=>{z.style.cursor='pointer';z.style.pointerEvents='all';z.addEventListener('click',()=>trigger(z.dataset.id))});
document.querySelectorAll('#tris .tri').forEach(tr=>{tr.style.pointerEvents='all';tr.addEventListener('click',()=>trigger(tr.dataset.id))});
$('dialog').onclick=()=>$('panel').classList.remove('open');
</script>
</body>
</html>
