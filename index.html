<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rae 的房间</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { background:#070b16; overflow:hidden; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  #stage { position:fixed; left:50%; top:50%; width:100dvw; height:100dvh; transform:translate(-50%,-50%);
           display:flex; flex-direction:column; background:#0b1020; }
  @media (orientation: portrait) {
    /* 竖屏时整台旋转 90°：等效强制横屏（点按坐标在脚本里同步换算） */
    #stage { width:100dvh; height:100dvw; transform:translate(-50%,-50%) rotate(90deg); }
  }
  #sceneWrap { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px 8px 0; }
  #scene { position:relative; border-radius:6px; overflow:hidden; background:#10182e; touch-action:manipulation; flex:none; }
  #fsBtn { position:absolute; right:12px; top:12px; z-index:300; width:38px; height:38px; border-radius:50%; border:2px solid rgba(255,236,190,.5);
           background:rgba(14,20,38,.55); color:#ffe9bb; font-size:19px; line-height:1; cursor:pointer; }
  #credit { position:absolute; left:12px; bottom:76px; z-index:50; color:rgba(198,212,238,.55); font-size:11px; pointer-events:none; letter-spacing:.3px; }
  #bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; user-select:none; -webkit-user-drag:none; }
  .sprite { position:absolute; transform:translate(-50%,-100%); pointer-events:none; }
  .sprite .fig { position:relative; width:100%; }
  .sprite .idle { display:block; width:100%; }
  .sprite .walk { display:none; width:100%; background-repeat:no-repeat; background-size:400% 100%; }
  .sprite .shadow { position:absolute; left:50%; bottom:-4%; width:88%; height:12%; transform:translateX(-50%); border-radius:50%;
                    background:radial-gradient(ellipse at center, rgba(8,6,12,.55) 0%, rgba(8,6,12,.30) 55%, rgba(8,6,12,0) 72%); }
  .sprite .shadow::after { content:""; position:absolute; left:-40%; top:35%; width:130%; height:160%; border-radius:50%;
                    background:radial-gradient(ellipse at center, rgba(18,11,4,.30), rgba(18,11,4,0) 70%); transform:skewX(-22deg); filter:blur(3px); }
  .hint-dot { position:absolute; width:11px; height:11px; margin:-5px 0 0 -5px; border-radius:50%; border:2px solid rgba(255,236,190,.9);
              box-shadow:0 0 0 3px rgba(90,60,20,.35), inset 0 0 4px rgba(255,255,255,.6); z-index:30; pointer-events:none;
              animation:pulse 2.4s ease-in-out infinite; transition:opacity .6s; }
  @keyframes pulse { 0%,100%{ transform:scale(.8); opacity:.65 } 50%{ transform:scale(1.12); opacity:1 } }
  .hint-dot.dim { opacity:.22; animation:none; }
  #pianoGlow { position:absolute; left:4.5%; top:30%; width:17%; height:38%; border-radius:50%; pointer-events:none; z-index:12;
               background:radial-gradient(ellipse at center, rgba(255,205,110,.34), rgba(255,205,110,0) 68%); opacity:0; transition:opacity .8s; }
  #pianoGlow.on { opacity:1; animation:glowPulse 3.2s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100%{ filter:brightness(1) } 50%{ filter:brightness(1.35) } }
  .fnote { position:absolute; z-index:35; color:#ffd98a; font-size:clamp(13px,2.2vw,21px); pointer-events:none;
           text-shadow:0 0 6px rgba(255,190,80,.8); animation:floatUp 3.4s ease-out forwards; }
  @keyframes floatUp { 0%{ transform:translate(0,0) rotate(-6deg); opacity:0 } 12%{ opacity:1 } 100%{ transform:translate(var(--dx,14px),-120px) rotate(10deg); opacity:0 } }
  #dialog { margin:8px; background:#f7ecd2; border:3px solid #8a6b3f; border-radius:10px; color:#43331d;
            padding:9px 16px; font-size:clamp(13px,2.2vw,16.5px); display:flex; align-items:center; gap:10px; min-height:50px; flex:none; }
  #dialog .star { color:#d9a441; font-size:19px; flex:none; }
  #panelWrap { position:absolute; inset:0; background:rgba(8,12,24,.58); display:none; align-items:center; justify-content:center; z-index:200; }
  #panel { background:#fdf6e0; color:#43331d; border:3px solid #8a6b3f; border-radius:12px; width:min(540px,94%); max-height:92%;
           overflow:auto; padding:18px 20px; box-shadow:0 14px 40px rgba(0,0,0,.5); }
  #panel h2 { font-size:19px; margin-bottom:10px; color:#5f4625; }
  #panel .body { font-size:14.5px; line-height:1.8; }
  #panel .body a { color:#8a5a1d; font-weight:700; }
  #panelClose { float:right; background:#8a6b3f; color:#fff; border:none; width:28px; height:28px; border-radius:50%; font-size:15px; cursor:pointer; }
  #wxCanvas { width:100%; display:block; border-radius:8px; border:2.5px solid #5d4426; margin-bottom:10px; background:#16224d; }
  .wx-big { font-size:30px; font-weight:800; color:#5f4625; }
  .notes { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:10px; margin:12px 0; }
  .note { padding:10px; border-radius:3px; font-size:12.5px; line-height:1.6; box-shadow:0 3px 6px rgba(0,0,0,.18); position:relative; min-height:84px; }
  .note::before { content:""; position:absolute; top:-5px; left:50%; transform:translateX(-50%); width:11px; height:11px; border-radius:50%;
                  background:radial-gradient(circle at 35% 30%, #ff9d9d, #d64545); box-shadow:0 1px 2px rgba(0,0,0,.4); }
  .note b { display:block; margin-bottom:3px; font-size:12px; color:rgba(0,0,0,.55); }
  .gb-form { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .gb-form input, .gb-form textarea { border:2px solid #cbb27f; border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; background:#fffdf4; }
  .gb-form button { background:#8a6b3f; color:#fff8e7; border:none; border-radius:8px; padding:9px; font-size:15px; font-weight:700; cursor:pointer; }
  .hint { color:#97835c; font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<div id="stage">
  <div id="sceneWrap">
  <div id="scene">
    <img id="bg" src="assets/room-bg.webp?v=3" alt="Rae 的像素房间">
    <div id="pianoGlow"></div>
    <div id="boy" class="sprite"><div class="shadow"></div><div class="fig"><img class="idle" src="assets/boy-idle.png" alt=""><div class="walk" style="background-image:url(assets/boy-walk.png); aspect-ratio:243/460"></div></div></div>
    <div id="girl" class="sprite"><div class="shadow"></div><div class="fig"><img class="idle" src="assets/girl-idle.png" alt=""><div class="walk" style="background-image:url(assets/girl-walk.png); aspect-ratio:279/460"></div></div></div>
    <div id="panelWrap"><div id="panel">
      <button id="panelClose">✕</button>
      <h2 id="panelTitle"></h2>
      <div class="body" id="panelBody"></div>
    </div></div>
  </div>
  </div>
  <div id="dialog"><span class="star">★</span><span id="dialogText"></span></div>
  <button id="fsBtn" title="全屏 / 横屏">⛶</button>
  <div id="credit">BGM: Erik Satie《Gymnopédie No.1》· Musopen 公共领域录音</div>
</div>
<audio id="bgm" loop preload="auto" src="assets/gymnopedie.mp3"></audio>

<script>
/* ================= 配置区：改文案只改这里 ================= */
const CONFIG = {
  idleDialog: "点一点房间里的东西，小人会自己走过去。",
  objects: {
    shelf:  { dialog:"书架上摆着我喜欢的书。—— 想了解我，先从这里开始。", title:"📚 关于我",
              body:`<p>你好，我是 <b>Rae</b>。这里是我的像素小房间，也是我的个人主页。</p><p>（这一段是占位文案，等 Rae 本人发来正式介绍后替换。）</p>` },
    record: { dialog:"唱片机和钢琴是连着的：钢琴一响，黑胶就跟着转。", title:"🎵 音乐",
              body:`<p>在这间屋里流淌的，是 Erik Satie 的《Gymnopédie No.1》。</p><p>点一点钢琴，就能让它响起来（或停下来）。</p>` },
    desk:   { dialog:"书桌上有我的电脑。—— 要找我，从这里。", title:"✉️ 联系我",
              body:`<p>GitHub：<a href="https://github.com/raemyn24" target="_blank" rel="noopener">github.com/raemyn24</a></p>
                    <p>我的日报《头版》：<a href="https://raemyn24.github.io/" target="_blank" rel="noopener">raemyn24.github.io</a></p>
                    <p>（邮箱等联系方式等 Rae 确认后再放上来。）</p>` },
    pianoOn:  "♪ 钢琴自己弹了起来——Satie《Gymnopédie No.1》。再点一次钢琴可以停下。",
    pianoOff: "音乐停了，房间安静下来。",
    pianoIdle:"一架旧钢琴。点它一下，它会自己弹起《Gymnopédie No.1》。",
    cat:    "蓝猫睡得正香，尾巴尖偶尔动一下。—— 嘘，别吵它。",
  }
};
/* ========================================================= */

const $ = id=>document.getElementById(id);
const scene = $('scene'), dialogText = $('dialogText');
/* 舞台尺寸适配：场景按 1993:972 装进舞台（扣掉对话框高度） */
function fit(){ const st = $('stage'); const W = st.clientWidth, H = st.clientHeight;
  const availH = H - $('dialog').offsetHeight - 26;
  let w = W - 16, h = w * 972/1993;
  if (h > availH) { h = availH; w = h * 1993/972; }
  scene.style.width = w + 'px'; scene.style.height = h + 'px'; }
addEventListener('resize', fit);
if (screen.orientation) screen.orientation.addEventListener('change', ()=>setTimeout(fit, 80));
addEventListener('load', ()=>{ fit(); setTimeout(fit, 300); });
$('fsBtn').addEventListener('click', async ()=>{
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else { const el = document.documentElement;
      if (el.requestFullscreen) await el.requestFullscreen({ navigationUI:'hide' }).catch(()=>el.requestFullscreen());
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      try { await screen.orientation.lock('landscape'); } catch(e){}
    }
  } catch(e){}
  setTimeout(fit, 350);
});
dialogText.textContent = CONFIG.idleDialog; fit();

/* ---------- 杭州天气（Open-Meteo） ---------- */
const WMO = {0:'晴',1:'晴间多云',2:'多云',3:'阴',45:'雾',48:'雾',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'阵雨',81:'阵雨',82:'暴雨阵雨',85:'阵雪',86:'阵雪',95:'雷阵雨',96:'雷阵雨',99:'雷阵雨'};
let weather = { temp:19, desc:'小雨', kind:'rain', hi:20, lo:14, hum:91, ok:false };
function wmoKind(c){ if([51,53,55,61,63,65,80,81,82,95,96,99].includes(c)) return 'rain'; if([71,73,75,77,85,86].includes(c)) return 'snow'; if(c===0) return 'clear'; if([1,2].includes(c)) return 'cloud'; return 'overcast'; }
fetch('https://api.open-meteo.com/v1/forecast?latitude=30.2741&longitude=120.1551&current=temperature_2m,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FShanghai')
  .then(r=>r.json()).then(d=>{ const c = d.current.weather_code;
    weather = { temp:Math.round(d.current.temperature_2m), desc:WMO[c]||'多云', kind:wmoKind(c),
                hi:Math.round(d.daily.temperature_2m_max[0]), lo:Math.round(d.daily.temperature_2m_min[0]),
                hum:Math.round(d.current.relative_humidity_2m), ok:true }; }).catch(()=>{});
const isDayNow = ()=>{ const h = new Date().getHours()+new Date().getMinutes()/60; return h>=6.5 && h<18.5; };

/* ---------- 场景坐标（占场景宽/高的比例） ---------- */
const STAND = { piano:{x:.155,y:.685}, shelf:{x:.245,y:.612}, window:{x:.468,y:.578}, record:{x:.610,y:.618},
                desk:{x:.800,y:.722}, board:{x:.822,y:.800}, cat:{x:.492,y:.730} };
const ZONES = [
  { id:'piano', x:.125, y:.44, rx:.088, ry:.21 }, { id:'shelf', x:.258, y:.35, rx:.088, ry:.25 },
  { id:'window', x:.550, y:.28, rx:.158, ry:.20 }, { id:'record', x:.615, y:.50, rx:.078, ry:.11 },
  { id:'window', x:.772, y:.285, rx:.038, ry:.08 }, { id:'desk', x:.797, y:.52, rx:.108, ry:.16 },
  { id:'board', x:.880, y:.375, rx:.078, ry:.17 }, { id:'cat', x:.562, y:.752, rx:.052, ry:.052 },
];
const HINTS = [ ['piano',.148,.330], ['shelf',.262,.185], ['window',.550,.478], ['record',.617,.428], ['desk',.800,.415], ['board',.880,.512] ];
HINTS.forEach(([id,x,y])=>{ const d=document.createElement('div'); d.className='hint-dot'; d.dataset.id=id;
  d.style.left=(x*100)+'%'; d.style.top=(y*100)+'%'; scene.appendChild(d); });
const WALK = { x0:.075, x1:.935, y0:.555, y1:.905 };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- 角色与移动（帧动画 + 避障寻路） ---------- */
const OBSTACLES = [
  {x0:.168,y0:.40,x1:.348,y1:.578},  // 书架
  {x0:.038,y0:.40,x1:.142,y1:.652},  // 钢琴主体
  {x0:.132,y0:.598,x1:.222,y1:.662}, // 琴凳
  {x0:.498,y0:.40,x1:.680,y1:.588},  // 唱片柜
  {x0:.655,y0:.40,x1:.895,y1:.685},  // 书桌（按画面占地：前沿到 .685）
  {x0:.660,y0:.575,x1:.775,y1:.795}, // 椅子
  {x0:.845,y0:.56,x1:.945,y1:.815},  // 绿植
  {x0:.512,y0:.700,x1:.612,y1:.830}, // 蓝猫（别踩它，前方也留空）
];
const NODES = [[.155,.700],[.245,.665],[.368,.635],[.455,.622],[.555,.652],[.700,.820],[.820,.715],
               [.200,.800],[.400,.805],[.600,.848],[.780,.848],[.908,.848],[.475,.718],[.636,.762],
               [.630,.640],[.810,.760],[.655,.855],[.860,.860],[.838,.848]];
const INFL = .010;
function segHitsRect(x1,y1,x2,y2,r){
  const dx=x2-x1, dy=y2-y1; let t0=0, t1=1;
  const p=[-dx,dx,-dy,dy], q=[x1-(r.x0-INFL),(r.x1+INFL)-x1,y1-(r.y0-INFL),(r.y1+INFL)-y1];
  for(let i=0;i<4;i++){ if(Math.abs(p[i])<1e-9){ if(q[i]<0) return false; }
    else { const t=q[i]/p[i]; if(p[i]<0){ if(t>t1) return false; if(t>t0) t0=t; } else { if(t<t0) return false; if(t<t1) t1=t; } } }
  return t0<=t1 && t1>0.001 && t0<0.999;
}
const segClear = (a,b)=> !OBSTACLES.some(r=> segHitsRect(a[0],a[1],b[0],b[1],r));
const inObstacle = (x,y,pad=0)=> OBSTACLES.some(r=> x>r.x0-pad && x<r.x1+pad && y>r.y0-pad && y<r.y1+pad);
function pushOut(x,y){ // 落在家具里时，环形向外找最近的空地
  if(!inObstacle(x,y,.004)) return [x,y];
  for(const r of [.025,.05,.08,.11,.15]){
    for(let k=0;k<8;k++){ const a = k*Math.PI/4, px = x+Math.cos(a)*r, py = y+Math.sin(a)*r;
      if(!inObstacle(px,py,.004)) return [px,py]; } }
  return [x,y];
}
function planPath(sx,sy,gx,gy){
  [gx,gy] = pushOut(gx,gy);
  const _sx = sx, _sy = sy;
  [sx,sy] = pushOut(sx,sy);
  const startPushed = (sx !== _sx || sy !== _sy);
  if(segClear([sx,sy],[gx,gy])) return (startPushed && Math.hypot(gx-sx,gy-sy) > .001) ? [[sx,sy],[gx,gy]] : [[gx,gy]];
  const pts = [[sx,sy], ...NODES, [gx,gy]], n = pts.length, gi = n-1;
  const dist = new Array(n).fill(Infinity), prev = new Array(n).fill(-1), done = new Array(n).fill(false);
  dist[0]=0;
  for(let k=0;k<n;k++){ let u=-1, best=Infinity;
    for(let i=0;i<n;i++) if(!done[i] && dist[i]<best){ best=dist[i]; u=i; }
    if(u<0) break; done[u]=true; if(u===gi) break;
    for(let v=0;v<n;v++){ if(done[v]||v===u) continue;
      if(segClear(pts[u],pts[v])){ const w=Math.hypot(pts[u][0]-pts[v][0],pts[u][1]-pts[v][1]);
        if(dist[u]+w<dist[v]){ dist[v]=dist[u]+w; prev[v]=u; } } }
  }
  if(!done[gi] && dist[gi]===Infinity) return []; // 无路可走：原地不动，不直线硬闯
  const path=[]; let cur=gi; while(cur>0){ path.unshift(pts[cur]); cur=prev[cur]; if(cur<0) break; }
  if(startPushed && path.length) path.unshift([sx,sy]); // 起点在家具里时，先走出到推出点
  return path;
}
function makeChar(el, wPct, x, y){
  return { el, fig: el.querySelector('.fig'), idleEl: el.querySelector('.idle'), walkEl: el.querySelector('.walk'),
           wPct, x, y, path:[], moving:false, face:1, action:null, frameT:Math.random()*4, speedF:0 };
}
const boy  = makeChar($('boy'),  5.60, .438, .705);
const girl = makeChar($('girl'), 4.95, .502, .698);
function placeChar(c){ const depth = .88 + (c.y-.555)*.55;
  c.el.style.left = (c.x*100)+'%'; c.el.style.top = (c.y*100)+'%';
  c.el.style.width = (c.wPct*depth)+'%'; c.el.style.zIndex = Math.round(c.y*100);
  c.fig.style.transform = `scaleX(${c.face})`;
  const lamp = Math.max(0, 1 - Math.hypot(c.x-.80, (c.y-.62)*1.6)/.50);
  const fstr = `brightness(${(.90+.14*lamp).toFixed(3)}) sepia(${(.08+.16*lamp).toFixed(3)}) saturate(${(.95+.04*lamp).toFixed(3)})`;
  if(c._f !== fstr){ c.fig.style.filter = fstr; c._f = fstr; }
  if(c.moving){ c.idleEl.style.display='none'; c.walkEl.style.display='block';
    c.walkEl.style.backgroundPosition = `${Math.floor(c.frameT)%4 * (100/3)}% 0`; }
  else { c.idleEl.style.display='block'; c.walkEl.style.display='none'; }
}
function followPath(c, dt, baseSpeed){
  if(!c.path.length){ c.moving=false; c.speedF=0; return true; }
  const [tx,ty] = c.path[0];
  const dx = tx-c.x, dy = ty-c.y, dist = Math.hypot(dx,dy);
  const isFinal = c.path.length===1;
  // 起步加速、临近终点减速，消除滑行感
  let target = 1;
  if(isFinal && dist < .075) target = Math.max(.3, dist/.075);
  c.speedF += (target - c.speedF) * Math.min(1, dt*7);
  const step = baseSpeed * c.speedF * dt;
  if(dist <= Math.max(step, .0035)){ c.x = tx; c.y = ty; c.path.shift();
    if(!c.path.length){ c.moving=false; c.speedF=0; return true; } return false; }
  c.x += dx/dist*step; c.y += dy/dist*step;
  if(Math.abs(dx) > .002) c.face = dx>0 ? 1 : -1;
  c.moving = true; c.frameT += dt * 9 * c.speedF;
  return false;
}
let girlPlanT = 0;
let lastT = performance.now();
function loop(now){ const dt = Math.min(.05,(now-lastT)/1000); lastT = now;
  const arrived = followPath(boy, dt, .30);
  if(arrived && boy.action){ const a = boy.action; boy.action = null; setTimeout(()=>doAction(a), 160); }
  // 女生：定期重新寻路到男孩身侧，不再拖着轨迹飘
  girlPlanT -= dt;
  const homeCands = [[boy.x-.054*boy.face, boy.y+.014],[boy.x+.054*boy.face, boy.y+.014],
                     [boy.x-.054*boy.face, boy.y+.062],[boy.x+.054*boy.face, boy.y+.062],[boy.x, boy.y+.07]];
  const home = homeCands.find(p=>!inObstacle(p[0],p[1],.01)) || homeCands[0];
  const homeX = home[0], homeY = home[1];
  const gd = Math.hypot(homeX-girl.x, homeY-girl.y);
  if(girlPlanT <= 0){ girlPlanT = .35;
    if(gd > .085 || (boy.moving && gd > .045)) girl.path = planPath(girl.x, girl.y, homeX, homeY); }
  if(gd > .018 || girl.path.length) followPath(girl, dt, .335);
  else girl.moving = false;
  placeChar(boy); placeChar(girl);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- 点按 ---------- */
scene.addEventListener('click', e=>{
  if(e.target.closest('#panelWrap') || panelOpen) return;
  const r = scene.getBoundingClientRect();
  const vx = (e.clientX-r.left)/r.width, vy = (e.clientY-r.top)/r.height;
  /* 竖屏时舞台被旋转了 90°，把视觉坐标换回场景坐标 */
  const rotated = matchMedia('(orientation: portrait)').matches;
  const px = rotated ? vy : vx, py = rotated ? 1 - vx : vy;
  let hit = null;
  for(const z of ZONES){ if(((px-z.x)/z.rx)**2 + ((py-z.y)/z.ry)**2 <= 1){ hit = z.id; break; } }
  document.querySelectorAll('.hint-dot').forEach(d=>d.classList.add('dim'));
  if(hit){ const s = STAND[hit]; boy.path = planPath(boy.x, boy.y, s.x, s.y); boy.action = hit; }
  else { boy.path = planPath(boy.x, boy.y, clamp(px, WALK.x0, WALK.x1), clamp(py, WALK.y0, WALK.y1)); boy.action = null; }
});

/* ---------- 动作与面板 ---------- */
let panelOpen = false, musicOn = false, noteTimer = null;
const bgm = $('bgm');
function doAction(id){
  if(id==='piano'){ toggleMusic(); return; }
  if(id==='cat'){ say(CONFIG.objects.cat); return; }
  if(id==='window'){ openWindowPanel(); return; }
  const obj = CONFIG.objects[id]; if(!obj) return;
  say(obj.dialog); openPanel(obj.title, obj.body);
}
function say(t){ dialogText.textContent = t; }
function toggleMusic(){
  if(musicOn){ bgm.pause(); musicOn=false; $('pianoGlow').classList.remove('on');
    clearInterval(noteTimer); say(CONFIG.objects.pianoOff); }
  else { say(CONFIG.objects.pianoOn);
    bgm.play().then(()=>{ musicOn=true; $('pianoGlow').classList.add('on');
      spawnNote(); noteTimer = setInterval(spawnNote, 800); })
    .catch(()=> say('咦，音乐没能播放（浏览器拦了一下），再点一次钢琴试试？')); }
}
function spawnNote(){ const n = document.createElement('span'); n.className='fnote'; n.textContent = Math.random()<.5?'♪':'♫';
  n.style.left = (10.5+Math.random()*7)+'%'; n.style.top = '36%'; n.style.setProperty('--dx', (Math.random()*36-10)+'px');
  scene.appendChild(n); setTimeout(()=>n.remove(), 3500); }
function openPanel(title, html){ $('panelTitle').textContent = title; $('panelBody').innerHTML = html;
  $('panelWrap').style.display='flex'; panelOpen = true; }
function closePanel(){ $('panelWrap').style.display='none'; panelOpen = false; stopWx(); }
$('panelClose').addEventListener('click', closePanel);
$('panelWrap').addEventListener('click', e=>{ if(e.target.id==='panelWrap') closePanel(); });

/* ---------- 窗户页：按当日天气动的窗景 ---------- */
let wxRAF = null;
function openWindowPanel(){
  say('窗外是杭州今天的天气。');
  const d = new Date(), wk = '日一二三四五六'[d.getDay()];
  openPanel('🌦 今日 · 杭州', `<canvas id="wxCanvas" width="640" height="360"></canvas>
    <p><span class="wx-big">${weather.temp}°C</span> &nbsp;杭州 · ${weather.desc}</p>
    <p>今日 ${weather.lo}° ~ ${weather.hi}°C · 湿度 ${weather.hum}% · ${d.getMonth()+1}月${d.getDate()}日 星期${wk}${weather.ok?'':'（天气接口暂时没连上，这是兜底数据）'}</p>
    <p>🗞 今天的《头版》：<a href="https://raemyn24.github.io/" target="_blank" rel="noopener">raemyn24.github.io</a></p>`);
  startWx();
}
function startWx(){
  const cv = $('wxCanvas'); if(!cv) return; const g = cv.getContext('2d');
  const day = isDayNow(), kind = weather.kind;
  const stars = Array.from({length:50},()=>({x:Math.random()*640,y:Math.random()*170,s:Math.random()<.25?2.4:1.3,tw:Math.random()*6.28}));
  const parts = Array.from({length:kind==='rain'?110:kind==='snow'?70:0},()=>({x:Math.random()*660,y:Math.random()*360,v: kind==='rain'? 5+Math.random()*4 : .6+Math.random()*.9, ph:Math.random()*6.28}));
  const clouds = Array.from({length:5},(_,i)=>({x:i*150+Math.random()*60, y:26+Math.random()*44, w:90+Math.random()*70, v:.12+Math.random()*.15}));
  function frame(t){
    const sky = g.createLinearGradient(0,0,0,360);
    if(day){ sky.addColorStop(0,'#6fa8e0'); sky.addColorStop(1,'#cfe6fb'); } else { sky.addColorStop(0,'#131f47'); sky.addColorStop(1,'#3a4a75'); }
    g.fillStyle = sky; g.fillRect(0,0,640,360);
    if(!day){ g.fillStyle='#ffeec2'; stars.forEach(s=>{ if(Math.sin(t/700+s.tw)>-0.25) g.fillRect(s.x,s.y,s.s,s.s); });
      g.fillStyle='#f5d76e'; g.beginPath(); g.arc(548,52,17,0,7); g.fill(); g.fillStyle='#1d2a55'; g.beginPath(); g.arc(540,47,15,0,7); g.fill(); }
    if(day && kind!=='overcast'){ g.fillStyle='#ffd94d'; g.beginPath(); g.arc(548,52,20,0,7); g.fill(); }
    g.fillStyle = day ? 'rgba(255,255,255,.92)' : 'rgba(70,90,140,.75)';
    clouds.forEach(c=>{ c.x += c.v; if(c.x-c.w>640) c.x = -c.w;
      g.beginPath(); g.ellipse(c.x, c.y, c.w/2, 13, 0, 0, 7); g.ellipse(c.x+22, c.y-8, c.w/3, 11, 0, 0, 7); g.fill(); });
    const city = [[8,208,66,152],[86,238,52,122],[150,196,74,164],[236,228,58,132],[306,206,68,154],[386,242,54,118],[452,214,72,146],[536,236,58,124],[604,218,44,142]];
    g.fillStyle = day ? '#5d7ba6' : '#0d1430';
    city.forEach(b=> g.fillRect(b[0],b[1],b[2],b[3]));
    if(!day){ g.fillStyle='#ffca7a'; for(let i=0;i<70;i++){ const bx=14+((i*53)%612), by=232+((i*29)%104); g.fillRect(bx,by,3.4,3.4); } }
    g.fillStyle = day ? '#7d94b5' : '#0a1026'; g.fillRect(0,336,640,24);
    // 天气粒子（雨/雪）
    if(kind==='rain'){ g.strokeStyle='rgba(195,220,255,.65)'; g.lineWidth=1.6; g.beginPath();
      parts.forEach(p=>{ p.y+=p.v*2.4; p.x-=p.v*.7; if(p.y>360){p.y=-8; p.x=Math.random()*680;} if(p.x<-10)p.x=650;
        g.moveTo(p.x,p.y); g.lineTo(p.x-3,p.y+13); }); g.stroke(); }
    if(kind==='snow'){ g.fillStyle='rgba(255,255,255,.9)';
      parts.forEach(p=>{ p.y+=p.v; p.x+=Math.sin(t/600+p.ph)*.5; if(p.y>360){p.y=-4; p.x=Math.random()*640;}
        g.beginPath(); g.arc(p.x,p.y,2.1,0,7); g.fill(); }); }
    // 窗框
    g.strokeStyle='#5d4426'; g.lineWidth=14; g.strokeRect(0,0,640,360); g.lineWidth=7;
    g.beginPath(); g.moveTo(320,0); g.lineTo(320,360); g.moveTo(0,180); g.lineTo(640,180); g.stroke();
    wxRAF = requestAnimationFrame(frame);
  }
  wxRAF = requestAnimationFrame(frame);
}
function stopWx(){ if(wxRAF) cancelAnimationFrame(wxRAF); wxRAF = null; }

/* ---------- 留言板 ---------- */
const SEED_NOTES = [
  { name:'屋主 Rae', text:'欢迎来到我的小房间，留张便签再走吧 📌', color:0 },
  { name:'路过的访客', text:'（示例留言）这个房间也太治愈了，钢琴还会自己弹！', color:2 },
];
const NOTE_COLORS = ['#ffd7e8','#fff3a0','#c8ecff','#d9f7c4','#ffe3b3','#f3d1ff'];
function loadNotes(){ try { return [...SEED_NOTES, ...JSON.parse(localStorage.getItem('rae-room-notes')||'[]')]; } catch(e){ return [...SEED_NOTES]; } }
function saveNote(name,text){ try { const arr = JSON.parse(localStorage.getItem('rae-room-notes')||'[]'); arr.push({name,text,color:arr.length%6}); localStorage.setItem('rae-room-notes', JSON.stringify(arr.slice(-30))); } catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function guestbookHTML(){
  const notes = loadNotes().slice(-12).reverse();
  return `<div class="notes">${notes.map(n=>`<div class="note" style="background:${NOTE_COLORS[n.color%6]}"><b>${esc(n.name)}</b>${esc(n.text)}</div>`).join('')}</div>
    <form class="gb-form" id="gbForm">
      <input id="gbName" maxlength="12" placeholder="你的昵称" required>
      <textarea id="gbText" rows="2" maxlength="80" placeholder="写点什么，钉在墙上…" required></textarea>
      <button type="submit">📌 钉上去</button>
    </form>
    <p class="hint">试玩版说明：留言目前只保存在你自己的浏览器里；正式版会接入留言服务，所有访客都能看到（且会先审后发）。</p>`;
}
const _openPanel = openPanel;
openPanel = function(title, html){ _openPanel(title, html); };
document.addEventListener('submit', e=>{
  if(e.target && e.target.id==='gbForm'){ e.preventDefault();
    saveNote($('gbName').value.trim()||'匿名访客', $('gbText').value.trim());
    openPanel('📌 留言板', guestbookHTML()); }
});
const _doAction = doAction;
doAction = function(id){
  if(id==='board'){ say('软木板上钉满了大家的便签。—— 你也可以留一张。'); openPanel('📌 留言板', guestbookHTML()); return; }
  _doAction(id);
};
</script>
