<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{overflow-x:clip}
  body{
    background:#000;color:#fff;min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:flex-start;justify-content:center;
  }
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .col{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:11vh 24px 48px;max-width:420px;width:100%;
    animation:fade .8s cubic-bezier(.2,.8,.25,1) both;
  }
  .ava{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;
    box-shadow:0 0 0 1px rgba(255,255,255,.22)}

    margin-top:26px;font-family:Georgia,"Times New Roman",serif;
    font-size:30px;letter-spacing:.32em;text-indent:.32em;font-weight:400;white-space:nowrap;
  }
  .handle{margin-top:14px;font-size:16.5px;color:#e7e9ea;display:flex;align-items:center;gap:5px}
  .badge{width:18px;height:18px;flex:none}
  .icons{margin-top:22px;display:flex;gap:26px;align-items:center}
  .icons a{display:block;line-height:0;opacity:.92;transition:opacity .15s ease,transform .15s ease;-webkit-tap-highlight-color:transparent}
  .icons a:hover{opacity:1;transform:translateY(-1.5px)}
  .icons svg{width:21px;height:21px;fill:#fff}
  .icons svg.line{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .name{margin-top:26px;font-size:17px;font-weight:600;letter-spacing:.02em}
  .bio{margin-top:9px;font-size:14.5px;line-height:1.55;color:#d6d9db;max-width:300px}
  .email{margin-top:52px;font-size:14.5px;color:#a7adb3;text-decoration:none;letter-spacing:.01em;transition:color .15s ease}
  .email:hover{color:#fff}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
