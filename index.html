<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rae 的像素小屋</title>
<style>
  html,body { margin:0; padding:0; height:100%; background:#070b16; overflow:hidden; -webkit-user-select:none; user-select:none; }
  #stage { position:fixed; inset:0 0 48px 0; display:flex; align-items:center; justify-content:center; }
  #room { width:min(100vw,196vh); height:min(100vh,51vw); display:block; touch-action:manipulation; }
  .tri { animation:triBob 1.6s ease-in-out infinite; cursor:pointer; }
  @keyframes triBob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  .tri.dim { opacity:.15; animation:none; }
  #dialog { position:fixed; left:50%; transform:translateX(-50%); bottom:58px; width:min(94vw,900px); z-index:50;
    background:#f7efdc; border:3px solid #7a5c3e; border-radius:12px; padding:10px 16px; font-size:16px; color:#4a3826;
    box-shadow:0 4px 18px rgba(0,0,0,.45); cursor:pointer; }
  #dialog .who { font-weight:700; color:#8a5a2b; margin-right:8px; }
  #panel { position:fixed; inset:0 0 48px 0; z-index:60; display:none; align-items:center; justify-content:center; background:rgba(5,8,18,.72); }
  #panel.open { display:flex; }
  #panelCard { width:min(92vw,560px); max-height:80vh; overflow:auto; background:#f7efdc; border:3px solid #7a5c3e; border-radius:14px; padding:18px 20px; color:#4a3826; }
  #panelCard h2 { margin:0 0 10px; font-size:20px; color:#8a5a2b; }
  #panelClose { float:right; border:2px solid #7a5c3e; background:#fff; border-radius:8px; padding:4px 12px; cursor:pointer; font-size:15px; }
  #infobar { position:fixed; left:0; right:0; bottom:0; height:48px; z-index:50; background:#1a1a2e; color:#ccc;
    display:flex; align-items:center; justify-content:center; font-size:13px; padding:0 12px; text-align:center; }
  #musicNote { animation:floatUp 2.6s ease-in-out infinite; }
  @keyframes floatUp { 0%,100% { transform:translateY(0); opacity:.9; } 50% { transform:translateY(-14px); opacity:.5; } }
  #vinyl { transform-box:fill-box; transform-origin:center; }
  #vinyl.spin { animation:spin 1.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .steamP { animation:steamUp 2.2s ease-in-out infinite; }
  @keyframes steamUp { 0% { transform:translateY(0); opacity:0; } 30% { opacity:.7; } 100% { transform:translateY(-26px); opacity:0; } }
  #tailG { transform-box:fill-box; transform-origin:15% 50%; animation:tailWag 2.2s ease-in-out infinite; }
  @keyframes tailWag { 0%,100% { transform:rotate(-10deg); } 50% { transform:rotate(14deg); } }
</style>
</head>

</div>

<div id="dialog"><span class="who">Rae</span><span id="dialogText">点一点房间里的东西，小人会自己走过去。也可以直接点地板走动。</span></div>
<div id="panel"><div id="panelCard"><button id="panelClose">关闭</button><h2 id="panelTitle"></h2><div id="panelBody"></div></div></div>
<div id="infobar">🎹钢琴听音乐 · 🎵唱片机 · 💻书桌 · 📅日历 · 📌留言板 · 🌙窗户看天气 —— 点三角互动，点地板走动</div>
<audio id="bgm" src="assets/gymnopedie.mp3" loop preload="auto"></audio>

<script>
"use strict";
const $ = id => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){ const e = document.createElementNS(SVGNS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
function say(who, text){ document.querySelector('#dialog .who').textContent = who; document.querySelector('#dialogText').textContent = text; }
function openPanel(title, html){ $('panelTitle').textContent = title; $('panelBody').innerHTML = html; $('panel').classList.add('open'); }
$('panelClose').onclick = ()=> $('panel').classList.remove('open');
$('panel').addEventListener('click', e=>{ if(e.target.id==='panel') $('panel').classList.remove('open'); });

/* 日历自动日期 */
(function(){
  const d = new Date();
  $('calM').textContent = (d.getMonth()+1)+'月';
  $('calD').textContent = d.getDate();
})();

/* 星星和城市 */
(function(){
  const g = $('stars');
  for(let i=0;i<70;i++){
    el('rect',{x:840+Math.random()*540, y:60+Math.random()*200, width:3, height:3, fill:'#ffeec2'}, g);
  }
  const c = $('city'), b=[[850,300,60,90],[920,320,50,70],[985,290,70,100],[1070,315,55,75],[1135,295,65,95],[1215,320,50,70],[1275,305,60,85],[1345,320,45,70]];
  b.forEach(r=> el('rect',{x:r[0],y:r[1],width:r[2],height:r[3],fill:'#0a0f24'}, c));
  for(let i=0;i<40;i++) el('rect',{x:860+((i*53)%500), y:310+((i*29)%60), width:5, height:5, fill:'#ffca7a'}, c);
})();

/* 深灰三角 */
const TRIS = [['piano',230,380],['record',1240,400],['desk',1630,420],['cal',1590,230],['board',1810,250],['window',1110,10]];
(function(){
  const g = $('tris');
  TRIS.forEach(([id,x,y])=>{
    el('polygon',{points:`${x},${y} ${x-15},${y-22} ${x+15},${y-22}`, fill:'#3d3d4f', stroke:'#14141f','stroke-width':3, class:'tri'}, g).dataset.id=id;
  });
})();
function dimTris(d){ document.querySelectorAll('#tris .tri').forEach(t=>t.classList.toggle('dim',d)); }

/* BGM */
const bgm = $('bgm');
let playing = false;
function toggleMusic(){
  playing = !playing;
  if(playing){ bgm.play().catch(()=>{}); $('vinyl').classList.add('spin'); setMusicNote(boy.x, boy.y-200, true); say('Rae','♪ 萨蒂《Gymnopédie No.1》'); }
  else { bgm.pause(); $('vinyl').classList.remove('spin'); setMusicNote(0,0,false); say('Rae','音乐停了。'); }
}
function setMusicNote(x,y,s){ const n=$('musicNote'); n.setAttribute('x',x); n.setAttribute('y',y); n.setAttribute('opacity',s?1:0); }

/* 天气 */
let weather = { temp:19, desc:'多云', hi:22, lo:15, hum:80, ok:false };
const WMO = {0:'晴',1:'晴间多云',2:'多云',3:'阴',45:'雾',48:'雾',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',61:'小雨',63:'中雨',65:'大雨',71:'小雪',73:'中雪',75:'大雪',80:'阵雨',81:'阵雨',82:'暴雨',95:'雷阵雨',96:'雷阵雨',99:'雷阵雨'};
fetch('https://api.open-meteo.com/v1/forecast?latitude=30.2741&longitude=120.1551&current=temperature_2m,relative_humidity_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FShanghai')
  .then(r=>r.json()).then(d=>{ const c=d.current.weather_code;
    weather={temp:Math.round(d.current.temperature_2m), desc:WMO[c]||'多云', hi:Math.round(d.daily.temperature_2m_max[0]), lo:Math.round(d.daily.temperature_2m_min[0]), hum:Math.round(d.current.relative_humidity_2m), ok:true};
  }).catch(()=>{});

/* 面板 */
const PANELS = {
  piano:['🎹 钢琴','<p>萨蒂《Gymnopédie No.1》</p><button onclick="toggleMusic()" style="padding:8px 20px;font-size:16px;">播放 / 停止</button>'],
  record:['🎵 唱片机','<p>正在播放：萨蒂《Gymnopédie No.1》</p><p>33⅓ RPM · 黑胶</p>'],
  desk:['💻 书桌','<p>Rae 的联系方式</p><p><i>（等 Rae 提供）</i></p>'],
  cal:['📅 日历',''],
  board:['📌 留言板','<div id="gbList"></div><input id="gbName" placeholder="名字" style="width:30%"><input id="gbText" placeholder="留句话吧" style="width:60%"><button onclick="addNote()">贴上</button>'],
  window:['🌙 窗外 · 杭州',''],
};
function updateCalPanel(){ const d=new Date(),w='日一二三四五六'[d.getDay()]; return `<p style="font-size:36px;">${d.getMonth()+1}月${d.getDate()}日</p><p>星期${w}</p>`; }
function updateWeatherPanel(){ const d=new Date(),w='日一二三四五六'[d.getDay()]; return `<p style="font-size:32px;">${weather.temp}°C ${weather.desc}</p><p>杭州 · ${weather.lo}°~${weather.hi}° · 湿度${weather.hum}%</p><p>${d.getMonth()+1}月${d.getDate()}日 星期${w}${weather.ok?'':'（离线）'}</p>`; }
let notes = JSON.parse(localStorage.getItem('rae_notes')||'[{"n":"屋主 Rae","t":"欢迎来到我的小房间！"}]');
function renderNotes(){ const l=$('gbList'); if(l) l.innerHTML=notes.map(n=>`<p><b>${n.n}:</b> ${n.t}</p>`).join(''); }
function addNote(){ const n=$('gbName').value.trim()||'匿名',t=$('gbText').value.trim(); if(!t)return; notes.push({n,t}); localStorage.setItem('rae_notes',JSON.stringify(notes)); renderNotes(); $('gbText').value=''; }

/* 人物 */
const boy={el:$('boy'),sh:$('boyShadow'),x:850,y:760,w:94,h:164};
const girl={el:$('girl'),sh:$('girlShadow'),x:770,y:760,w:84,h:148};
function place(p){ p.el.setAttribute('x',p.x-p.w/2); p.el.setAttribute('y',p.y-p.h); p.sh.setAttribute('cx',p.x); p.sh.setAttribute('cy',p.y+6); }
place(boy); place(girl);
let girlTarget=null, walking=false;
const STAND={piano:[240,680],record:[1240,700],desk:[1630,740],cal:[1590,680],board:[1810,650],window:[1110,600]};
const OBSTACLES=[{x0:80,x1:400,y0:400,y1:720},{x0:420,x1:640,y0:160,y1:600},{x0:1080,x1:1400,y0:420,y1:660},{x0:1440,x1:1820,y0:440,y1:760}];

function walkTo(tx,ty,done){
  if(walking) return; walking=true; dimTris(true);
  girlTarget={x:tx-85,y:ty};
  OBSTACLES.forEach(r=>{ if(tx>r.x0&&tx<r.x1&&ty>r.y0&&ty<r.y1) ty=r.y1+50; });
  const speed=300; let last=performance.now();
  function step(t){
    const dt=Math.min(50,t-last)/1000; last=t;
    const dx=tx-boy.x, dy=ty-boy.y, dist=Math.hypot(dx,dy);
    if(dist<10){
      walking=false; dimTris(false); boy.el.style.transform=''; place(boy); walkGirl();
      if(done) done(); return;
    }
    boy.x+=dx/dist*speed*dt; boy.y+=dy/dist*speed*dt;
    const flip=dx<0?'scaleX(-1) ':'';
    const bobY=Math.abs(Math.sin(t/150))*10;
    const tilt=Math.sin(t/300)*4;
    boy.el.style.transform=`${flip}translateY(${-bobY}px) rotate(${tilt}deg)`;
    boy.el.style.transformBox='fill-box'; boy.el.style.transformOrigin='50% 100%';
    place(boy); requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function walkGirl(){
  if(!girlTarget) return;
  const tx=girlTarget.x, ty=girlTarget.y, speed=260; let last=performance.now();
  function step(t){
    const dt=Math.min(50,t-last)/1000; last=t;
    const dx=tx-girl.x, dy=ty-girl.y, d=Math.hypot(dx,dy);
    if(d<12){ girl.el.style.transform=''; place(girl); return; }
    girl.x+=dx/d*speed*dt; girl.y+=dy/d*speed*dt;
    const flip=dx<0?'scaleX(-1) ':'';
    const bobY=Math.abs(Math.sin(t/150))*8;
    girl.el.style.transform=`${flip}translateY(${-bobY}px)`;
    girl.el.style.transformBox='fill-box'; girl.el.style.transformOrigin='50% 100%';
    place(girl); requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function svgPoint(e){
  const svg=$('room'), pt=svg.createSVGPoint();
  pt.x=e.clientX; pt.y=e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
